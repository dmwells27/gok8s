name: Build App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [12.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: core.harbor.domain
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        id: docker-build
        with:
          push: true
          tags: core.harbor.domain/library/gok8s:latest

      - name: Display SHA
        run: echo {{ steps.docker-build.outputs.digest }}

      - name: Display Metadata
        run: echo {{ steps.docker-build.outputs.metadata }}

      - name: Display Image
        run: echo {{ steps.docker-build.outputs.imageid }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign image with Cosign
        run: |
          cosign sign --key k8s://secured/cosign-key core.harbor.domain/library/gok8s:${{ steps.version.outputs.version }}
